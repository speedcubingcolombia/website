# Publishes the site to Cloudflare (speedcubingcolombia.org) on every push to main.
# Can also be run by hand from the Actions tab ("Run workflow").
# Needs the CLOUDFLARE_API_TOKEN secret (organization secret, Workers edit permission).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
