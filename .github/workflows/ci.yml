# Builds the site on every pull request, so a broken build is caught before merging.
name: CI
on:
  # Lets dependabot-auto-merge.yml run these checks before merging.
  workflow_call:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
