# Merges Dependabot minor and patch updates once CI passes. Major updates stay
# open for a manual review.
#
# Branch protection with required checks is not available for private repos on
# the Free plan, so GitHub's native auto-merge would not wait for CI. Instead this
# workflow runs CI itself (as a reusable workflow) and merges only if it passes.
#
# The merge uses GITHUB_TOKEN, so it does not trigger push workflows (deploys):
# merged updates go live with the next regular push to main.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  ci:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/ci.yml

  merge:
    needs: ci
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Merge minor and patch updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --rebase --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
